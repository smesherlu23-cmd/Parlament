<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!-- Окно не ходит в сеть: всё своё лежит рядом. Строгая политика оставляет
       только собственные ресурсы и не разрешает inline-скрипты. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none';
                 script-src 'self';
                 style-src 'self';
                 font-src 'self';
                 img-src 'self' data:;
                 form-action 'none';
                 base-uri 'none'">
  <title>Парламент</title>
  <link rel="stylesheet" href="css/broadsheet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
