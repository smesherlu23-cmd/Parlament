name: Build Windows EXE

# Ручная сборка десктопного приложения под Windows и публикация готового
# .exe как GitHub Release. Windows-сборка Flutter (а значит и flet build
# windows) требует именно Windows-хоста с MSVC — поэтому раннер windows-latest,
# а не привычный ubuntu-latest.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (по умолчанию — windows-build-<номер запуска>)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Собрать приложение
        # --yes — не спрашивать подтверждения на установку Flutter SDK (иначе
        # интерактивный запрос в неинтерактивном раннере обрывает сборку);
        # --no-rich-output — плашки-эмодзи и Rich-спиннер валят вывод в
        # UnicodeEncodeError на консоли Windows-раннера (кодовая страница
        # cp1252, не UTF-8) — обычный текстовый вывод этого не боится.
        # PYTHONUTF8/PYTHONIOENCODING — подстраховка на случай, если что-то
        # непредвиденное всё равно попробует напечатать юникод.
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: flet build windows --yes --no-rich-output

      - name: Собрать инсталлятор
        # build/windows — папка с exe и десятком DLL/данных, так собирает
        # любое Flutter+Python (flet) приложение под Windows — это нормально,
        # так выглядит вообще любая Flutter-сборка под Windows, а не брак
        # именно этой сборки. Чтобы пользователь не разглядывал эту папку
        # руками, упаковываем её в один инсталлятор через Inno Setup (уже
        # стоит на windows-latest, есть и chocolatey-фолбэк на случай, если
        # это изменится): ставит приложение в Program Files, добавляет
        # ярлык в «Пуск» и на рабочий стол, сам создаёт деинсталлятор —
        # пользователь видит только один ParlamentSetup.exe и обычный,
        # знакомый мастер установки Windows-программы, а не голый SFX,
        # который тихо распаковывает и запускает exe из временной папки
        # (см. предыдущую попытку в истории коммитов — под эту эвристику
        # антивирусы массово принимают такие файлы за троян-дроппер).
        shell: pwsh
        run: |
          $buildRoot = (Resolve-Path "build/windows").Path
          $mainExe = Get-ChildItem -Path $buildRoot -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $mainExe) { throw "В build/windows не нашлось ни одного .exe" }
          Write-Host "Приложение внутри инсталлятора: $($mainExe.Name)"

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "ISCC.exe не найден по умолчанию, ставлю Inno Setup через choco"
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe так и не нашёлся" }

          & $iscc "/DMyAppExeName=$($mainExe.Name)" "packaging\windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup не смог собрать инсталлятор" }

          $setup = Get-ChildItem -Path "packaging\windows\dist" -Filter "*.exe" | Select-Object -First 1
          if (-not $setup) { throw "Инсталлятор не найден после сборки" }
          Copy-Item $setup.FullName "ParlamentSetup.exe"
          Write-Host "Готово: ParlamentSetup.exe ($((Get-Item 'ParlamentSetup.exe').Length) байт)"

      - name: Определить тег релиза
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=windows-build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" ParlamentSetup.exe \
            --title "Парламент — Windows (${{ steps.tag.outputs.tag }})" \
            --notes "Автосборка из коммита ${{ github.sha }} через flet build windows + Inno Setup. Один файл — ParlamentSetup.exe: обычный мастер установки, ставит в Program Files и добавляет ярлык." \
            --target "${{ github.sha }}"
