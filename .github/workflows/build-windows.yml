name: Build Windows EXE

# Ручная сборка десктопного приложения под Windows и публикация готового
# .exe как GitHub Release. Windows-сборка Flutter (а значит и flet build
# windows) требует именно Windows-хоста с MSVC — поэтому раннер windows-latest,
# а не привычный ubuntu-latest.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (по умолчанию — windows-build-<номер запуска>)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Собрать приложение
        # --yes — не спрашивать подтверждения на установку Flutter SDK (иначе
        # интерактивный запрос в неинтерактивном раннере обрывает сборку);
        # --no-rich-output — плашки-эмодзи и Rich-спиннер валят вывод в
        # UnicodeEncodeError на консоли Windows-раннера (кодовая страница
        # cp1252, не UTF-8) — обычный текстовый вывод этого не боится.
        # PYTHONUTF8/PYTHONIOENCODING — подстраховка на случай, если что-то
        # непредвиденное всё равно попробует напечатать юникод.
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: flet build windows --yes --no-rich-output

      - name: Собрать один исполняемый файл
        # flet build windows (как и любая Flutter-сборка) — это папка: exe
        # плюс десяток DLL и папка data, ни один инструмент их в один файл
        # без обёртки не склеит. Оборачиваем всю папку build/windows в
        # самораспаковывающийся 7-Zip SFX: результат — один Parlament.exe,
        # который при запуске тихо распаковывает себя во временную папку и
        # сразу стартует настоящее приложение — 7-Zip с этим модулем уже
        # стоит на windows-latest, ставить ничего не нужно.
        shell: pwsh
        run: |
          $sevenZip = "$Env:ProgramFiles\7-Zip\7z.exe"
          $sfxModule = "$Env:ProgramFiles\7-Zip\7z.sfx"
          if (-not (Test-Path $sevenZip)) { throw "7z.exe не найден: $sevenZip" }
          if (-not (Test-Path $sfxModule)) { throw "7z.sfx не найден: $sfxModule" }

          $buildRoot = (Resolve-Path "build/windows").Path
          $mainExe = Get-ChildItem -Path $buildRoot -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $mainExe) { throw "В build/windows не нашлось ни одного .exe" }
          $relPath = $mainExe.FullName.Substring($buildRoot.Length + 1)
          Write-Host "Точка входа в архиве: $relPath"

          $archive = Join-Path $PWD "app.7z"
          Push-Location $buildRoot
          & $sevenZip a -r $archive "*"
          Pop-Location
          if ($LASTEXITCODE -ne 0) { throw "7z не смог собрать архив" }

          # Без here-string: у него закрывающий "@ обязан стоять в самом
          # начале строки, а это меньше отступа, чем у блока `run: |` в
          # YAML — такая строка преждевременно оборвала бы весь блок.
          $configLines = @(
            ';!@Install@!UTF-8!'
            'Title="Парламент"'
            'BeginPrompt="Установить и запустить «Парламент»?"'
            "RunProgram=`"$relPath`""
            ';!@InstallEnd@!'
          )
          $configPath = "sfx-config.txt"
          $config = $configLines -join "`r`n"
          [System.IO.File]::WriteAllText($configPath, $config, (New-Object System.Text.UTF8Encoding($false)))

          $output = "Parlament.exe"
          cmd /c copy /b "$sfxModule" + "$configPath" + "$archive" "$output"
          if ($LASTEXITCODE -ne 0) { throw "Сборка SFX не удалась" }
          Write-Host "Готово: $output ($((Get-Item $output).Length) байт)"

      - name: Определить тег релиза
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=windows-build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" Parlament.exe \
            --title "Парламент — Windows (${{ steps.tag.outputs.tag }})" \
            --notes "Автосборка из коммита ${{ github.sha }} через flet build windows. Один файл — Parlament.exe: при запуске распаковывает себя во временную папку и сразу открывает приложение." \
            --target "${{ github.sha }}"
